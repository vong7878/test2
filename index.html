<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!DOCTYPE html> 
<html lang="lo" class="scroll-smooth"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>ລະບົບຂ່າວສານ ແລະ ຕິດຕາມການອະນາໄມ - ຈຸປ້ອງກັນ</title> 

    <!-- 🛑 ເອົາໂຄ້ດລັອກໜ້າຈໍ ແລະ ບລັອກ In-App Browser มาวางไว้ตรงนี้ (จุดแรกสุดใน head) -->
    <script>
        (function() {
            const ua = navigator.userAgent || navigator.vendor || window.opera;
            const isZalo = /Zalo/i.test(ua);
            const isFacebook = /FBAN|FBAV|FB_IAB|Messenger/i.test(ua);
            const isLine = /Line/i.test(ua);
            const isInstagram = /Instagram/i.test(ua);
            const isWebView = /(iPhone|iP[ad]|Android).*AppleWebKit(?!.*Safari)/i.test(ua);

            if (isZalo || isFacebook || isLine || isInstagram || isWebView) {
                // 🛑 ລັອກໜ້າຈໍ ແລະ ຊ່ອນເນື້ອຫາທັງໝົດທັນທີ ບໍ່ให้ scroll ຫຼື ສະແດງຫຍັງເລີຍ
                const style = document.createElement('style');
                style.innerHTML = `
                    html, body {
                        overflow: hidden !important;
                        height: 100vh !important;
                        position: fixed !important;
                        width: 100vw !important;
                        margin: 0 !important;
                        background-color: #020617 !important;
                    }
                    body > *:not(#inapp-blocker-screen) {
                        display: none !important;
                    }
                `;
                document.head.appendChild(style);

                // 🛑 ສະແດງກ່ອງເຕືອນເຕັມຈໍ
                document.addEventListener("DOMContentLoaded", function() {
                    if (!document.getElementById('inapp-blocker-screen')) {
                        const blocker = document.createElement('div');
                        blocker.id = 'inapp-blocker-screen';
                        blocker.style.cssText = 'position: fixed; inset: 0; background-color: #020617; z-index: 2147483647; display: flex; align-items: center; justify-content: center; padding: 20px; font-family: sans-serif; box-sizing: border-box;';
                        
                        blocker.addEventListener("touchmove", function(e) { e.preventDefault(); }, { passive: false });
                        
                        blocker.innerHTML = `
                            <div style="background-color: #0f172a; border: 1px solid #f59e0b; padding: 24px; border-radius: 16px; max-width: 360px; width: 100%; text-align: center; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.9);">
                                <div style="font-size: 40px; margin-bottom: 12px;">🌐</div>
                                <h3 style="color: #f59e0b; font-size: 18px; font-weight: bold; margin-bottom: 8px;">ກະລຸນາເປີດຜ່ານ Google Chrome / Safari</h3>
                                <p style="color: #cbd5e1; font-size: 12px; line-height: 1.6; margin-bottom: 16px;">
                                    ລະບົບປ້ອງກັນບໍ່ให้ໃຊ້ In-App Browser ຂອງແອັບ (Zalo/Messenger/Line) ເພາະจะເຮັດໃຫ້ຖ່າຍວິດີໂອ ແລະ ອັບໂຫຼດໄຟລ໌ບໍ່ໄດ້!
                                </p>
                                <div style="background-color: #1e293b; padding: 12px; border-radius: 10px; border: 1px solid #334155; text-align: left;">
                                    <p style="color: #38bdf8; font-size: 11px; font-weight: bold; margin-bottom: 4px;">💡 ວິທີແກ້ໄຂງ່າຍໆ:</p>
                                    <p style="color: #94a3b8; font-size: 11px; line-height: 1.4;">
                                        1. ກົດປຸ່ມ <b>3 ຈຸດ (...)</b> ທີ່ມຸມຂວາບົນ.<br>
                                        2. ເລືອກ <b>"ເປີດໃນ Browser ຫຼັກ"</b> (Open in Chrome / Safari).
                                    </p>
                                </div>
                            </div>
                        `;
                        document.body.appendChild(blocker);
                    }
                });
            }
        })();
    </script>
    <!-- 🛑 สิ้นสุดโค้ดบล็อก -->

    <!-- Favicon --> 
    <link rel="icon" type="image/png" href="...">
    <!-- ... ໂຄ້ດສ່ວນອື່ນໆໃນ head ... -->
</head>
    <title>ເລືອກພາສາ - Select Language</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts (Noto Sans Lao) -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans Lao', sans-serif;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-900 via-indigo-900 to-slate-900 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white/10 backdrop-blur-lg border border-white/20 p-8 rounded-3xl shadow-2xl w-full max-w-md text-center text-white">
        
        <!-- Logo ຫຼື ຮູບສັນຍາລັກ -->
        <div class="mb-6">
            <div class="w-16 h-16 bg-blue-500 rounded-2xl mx-auto flex items-center justify-center shadow-lg shadow-blue-500/50 mb-4">
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round5" stroke-width="2" d="M3 5h12M9 3v2m1.048 9.5A18.022 18.022 0 016.412 9m6.088 9h7M11 21l5-10 5 10M12.751 5C11.783 10.77 8.07 15.61 3 18.129"></path>
                </svg>
            </div>
            <h1 id="title" class="text-2xl font-bold mb-2">ກະລຸນາເລືອກພາສາຂອງທ່ານ</h1>
            <p id="subtitle" class="text-gray-300 text-sm">Please select your preferred language</p>
        </div>

        <!-- ປຸ່ມເລືອກພາສາ -->
        <div class="grid grid-cols-1 gap-3 mb-8">
            <!-- ພາສາລາວ -->
            <button onclick="selectLanguage('lo')" class="lang-btn flex items-center p-3 rounded-xl bg-white/5 hover:bg-white/20 border border-white/10 transition-all duration-300 group">
                <span class="text-2xl mr-4">🇱🇦</span>
                <span class="font-semibold text-lg flex-1 text-left">ພາສາລາວ</span>
                <span class="text-xs text-gray-400 group-hover:text-white">Lao</span>
            </button>

            <!-- ພາສາໄທ -->
            <button onclick="selectLanguage('th')" class="lang-btn flex items-center p-3 rounded-xl bg-white/5 hover:bg-white/20 border border-white/10 transition-all duration-300 group">
                <span class="text-2xl mr-4">🇹🇭</span>
                <span class="font-semibold text-lg flex-1 text-left">ภาษาไทย</span>
                <span class="text-xs text-gray-400 group-hover:text-white">Thai</span>
            </button>

            <!-- ພາສາຫວຽດນາມ -->
            <button onclick="selectLanguage('vi')" class="lang-btn flex items-center p-3 rounded-xl bg-white/5 hover:bg-white/20 border border-white/10 transition-all duration-300 group">
                <span class="text-2xl mr-4">🇻🇳</span>
                <span class="font-semibold text-lg flex-1 text-left">Tiếng Việt</span>
                <span class="text-xs text-gray-400 group-hover:text-white">Vietnamese</span>
            </button>

            <!-- ພາສາຈີນ -->
            <button onclick="selectLanguage('zh')" class="lang-btn flex items-center p-3 rounded-xl bg-white/5 hover:bg-white/20 border border-white/10 transition-all duration-300 group">
                <span class="text-2xl mr-4">🇨🇳</span>
                <span class="font-semibold text-lg flex-1 text-left">中文</span>
                <span class="text-xs text-gray-400 group-hover:text-white">Chinese</span>
            </button>

            <!-- ພາສາອັງກິດ -->
            <button onclick="selectLanguage('en')" class="lang-btn flex items-center p-3 rounded-xl bg-white/5 hover:bg-white/20 border border-white/10 transition-all duration-300 group">
                <span class="text-2xl mr-4">🇬🇧</span>
                <span class="font-semibold text-lg flex-1 text-left">English</span>
                <span class="text-xs text-gray-400 group-hover:text-white">English</span>
            </button>

            <!-- ພາສາເກົາຫລີ -->
            <button onclick="selectLanguage('ko')" class="lang-btn flex items-center p-3 rounded-xl bg-white/5 hover:bg-white/20 border border-white/10 transition-all duration-300 group">
                <span class="text-2xl mr-4">🇰🇷</span>
                <span class="font-semibold text-lg flex-1 text-left">한국어</span>
                <span class="text-xs text-gray-400 group-hover:text-white">Korean</span>
            </button>
        </div>

        <!-- ປຸ່ມຢືນຢັນໄປໜ້າຕໍ່ໄປ -->
        <button onclick="proceedToLogin()" class="w-full py-3 bg-blue-600 hover:bg-blue-500 rounded-xl font-bold shadow-lg shadow-blue-600/30 transition-all duration-300">
            ສືບຕໍ່ / Continue
        </button>

    </div>

    <script>
        let currentLang = 'lo'; // ຄ່າເລີ່ມຕົ້ນ

        function selectLanguage(lang) {
            currentLang = lang;
            // ບັນທຶກພາສາທີ່ເລືອກໄວ້ໃນ LocalStorage ເພື່ອເອົາໄປໃຊ້ຕໍ່ໜ້າເຂົ້າສູ່ລະບົບ
            localStorage.setItem('selectedLanguage', lang);
            
            // ເພີ່ມເອັບເຟັກສີຂອບໃຫ້ຮູ້ວ່າເລືອກແລ້ວ
            event.currentTarget.classList.add('border-blue-500', 'bg-white/20');
            
            // ປ່ຽນຂໍ້ຄວາມຫົວຂໍ້ຕາມພາສາທີ່ເລືອກ (ຕົວຢ່າງ)
            updateUIText(lang);
        }

        function updateUIText(lang) {
            const texts = {
                lo: { title: "ກະລຸນາເລືອກພາສາຂອງທ່ານ", subtitle: "ກະລຸນາເລືອກພາສາທີ່ທ່ານຕ້ອງການໃຊ້ງານ" },
                th: { title: "กรุณาเลือกภาษาของคุณ", subtitle: "โปรดเลือกภาษาที่คุณต้องการใช้งาน" },
                vi: { title: "Vui lòng chọn ngôn ngữ của bạn", subtitle: "Vui lòng chọn ngôn ngữ ưa thích của bạn" },
                zh: { title: "请选择您的语言", subtitle: "请选择您偏好的语言" },
                en: { title: "Please select your language", subtitle: "Please select your preferred language" },
                ko: { title: "언어를 선택해 주세요", subtitle: "선호하는 언어를 선택해 주세요" }
            };

            if (texts[lang]) {
                document.getElementById('title').innerText = texts[lang].title;
                document.getElementById('subtitle').innerText = texts[lang].subtitle;
            }
        }

      function proceedToLogin() {
            // ເເນວທາງການປ່ຽນໜ້າຕາມພາສາທີ່ເລືອກ
            switch (currentLang) {
                case 'lo':
                    window.location.href = `index.html?lang=${currentLang}`;
                    break;
                case 'th':
                    window.location.href = `index_th.html?lang=${currentLang}`;
                    break;
                case 'zh':
                    window.location.href = `index_ch.html?lang=${currentLang}`;
                    break;
                case 'vi':
                    window.location.href = `index_vn.html?lang=${currentLang}`;
                    break;
                case 'en':
                    window.location.href = `index_en.html?lang=${currentLang}`;
                    break;
                case 'ko':
                    window.location.href = `index_kr.html?lang=${currentLang}`;
                    break;
                default:
                    // ກໍລະນີສຸກເສີນ ຖ້າບໍ່ົງກ່ຽວຫຍັງເລີຍ ໃຫ້ກັບໄປໜ້າຫຼັກ (ລາວ)
                    window.location.href = `index.html?lang=lo`;
                    break;
            }
        }
        // ດຶງຄ່າພາສາທີ່ສົ່ງມາຈາກ URL ຫຼື LocalStorage
const urlParams = new URLSearchParams(window.location.search);
const lang = urlParams.get('lang') || localStorage.getItem('selectedLanguage') || 'lo';


    </script>
</body>
</html>
